[package]
name = "blog"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lumos example app: JSON:API blog with auth, validation, and ORM"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[dependencies]
lumos = { workspace = true, features = ["orm", "migrations", "validation", "auth", "jsonapi"] }
lumos-cli.workspace = true
rusticate.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde = { workspace = true }
chrono = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
lumos-testing.workspace = true
