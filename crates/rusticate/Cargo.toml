[package]
name = "rusticate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rusticate"
readme = "README.md"
description = "Rusticate: Eloquent-inspired ORM for Rust (usable with or without Lumos)"

[dependencies]
sqlx = { workspace = true, features = ["any", "runtime-tokio-rustls", "sqlite", "postgres", "mysql", "chrono", "json", "uuid"] }
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
lumos-macros.workspace = true
