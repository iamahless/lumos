[package]
name = "lumos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/lumos-core"
description = "Lumos kernel: routing, HTTP primitives, service container, config, errors, middleware"

[features]
default = []
orm = ["dep:rusticate"]
validation = ["dep:validator"]
auth = ["validation", "dep:argon2"]
views = ["dep:askama"]
# Pure flags (wiring only; modules land in the noted phase).
cache = []               # Phase 3+
queue = []               # v0.2
jsonapi = []             # Phase 4
jsonapi-lite = []        # Phase 4
http-cache = ["dep:tower-http"]

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
async-trait.workspace = true
toml.workspace = true
dotenvy.workspace = true
tower-http = { workspace = true, optional = true }
rusticate = { workspace = true, optional = true }
validator = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
askama = { workspace = true, optional = true }
