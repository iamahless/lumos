[package]
name = "lumos-rs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/lumos-rs-cli"
readme = "README.md"
description = "Artisan-like developer CLI for Lumos: generators, migrations, dev server"

[lib]
name = "lumos_cli"

[[bin]]
name = "lumos"
path = "src/main.rs"

[dependencies]
lumos-core.workspace = true
rusticate.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
