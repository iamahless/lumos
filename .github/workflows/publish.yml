name: publish

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Release version to publish, without the v prefix"
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: crates-io-${{ github.ref }}
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always

jobs:
    validate-release:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.value }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.sha }}

            - id: version
              shell: bash
              env:
                  RELEASE_VERSION_INPUT: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  tag_version="${RELEASE_VERSION_INPUT:-${GITHUB_REF_NAME#v}}"
                  workspace_version="$(awk '
                    /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
                    /^\[/ { in_workspace_package = 0 }
                    in_workspace_package && $1 == "version" {
                      gsub(/"/, "", $3)
                      print $3
                      exit
                    }
                  ' Cargo.toml)"

                  test -n "$workspace_version"
                  test "$tag_version" = "$workspace_version"

                  for crate in lumos-core lumos-macros rusticate lumos-jsonapi; do
                    expected="${crate} = { version = \"${workspace_version}\", path ="
                    if ! grep -Fq "$expected" Cargo.toml; then
                      printf '%s v%s does not depend on %s v%s. Update the internal dependency version before tagging.\n' \
                        'workspace' "$workspace_version" "$crate" "$workspace_version" >&2
                      exit 1
                    fi
                  done

                  printf 'value=%s\n' "$workspace_version" >> "$GITHUB_OUTPUT"

            - run: cargo fmt --all -- --check
            - run: cargo test --workspace

    publish:
        needs: validate-release
        runs-on: ubuntu-latest
        environment: crates-io
        env:
            CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
            RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.sha }}

            - name: Confirm crates.io credentials are configured
              shell: bash
              run: |
                  set -euo pipefail
                  test -n "$CARGO_REGISTRY_TOKEN"

            - name: Publish workspace crates in dependency order
              shell: bash
              run: |
                  set -euo pipefail

                  packages=(
                    lumos-macros
                    rusticate
                    lumos-core
                    lumos-jsonapi
                    lumos-testing
                    lumos-cli
                    lumos
                  )

                  for package in "${packages[@]}"; do
                    cargo publish --locked --package "$package"
                    echo "Published $package v$RELEASE_VERSION"
                  done
