name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(awk '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/\"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          test -n "$workspace_version"
          test "$tag_version" = "$workspace_version"

          for crate in lumos-core lumos-macros rusticate lumos-jsonapi; do
            expected="${crate} = { version = \"${workspace_version}\", path ="
            if ! grep -Fq "$expected" Cargo.toml; then
              printf '%s v%s does not depend on %s v%s. Update the internal dependency version before tagging.\n' \
                'workspace' "$workspace_version" "$crate" "$workspace_version" >&2
              exit 1
            fi
          done

          printf 'value=%s\n' "$workspace_version" >> "$GITHUB_OUTPUT"

      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  publish:
    needs: validate-release
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm crates.io credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"

      - name: Publish workspace crates in dependency order
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            lumos-macros
            rusticate
            lumos-core
            lumos-jsonapi
            lumos-testing
            lumos-cli
            lumos
          )

          for package in "${packages[@]}"; do
            cargo publish --locked --package "$package"
            echo "Published $package v$RELEASE_VERSION"

            for attempt in {1..30}; do
              if curl --fail --silent --show-error --location \
                "https://crates.io/api/v1/crates/$package/$RELEASE_VERSION" >/dev/null; then
                break
              fi

              if [[ "$attempt" == 30 ]]; then
                echo "Timed out waiting for $package v$RELEASE_VERSION on crates.io." >&2
                exit 1
              fi

              sleep 10
            done
          done
