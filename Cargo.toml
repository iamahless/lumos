[workspace]
resolver = "2"
members = [
    "crates/lumos",
    "crates/lumos-core",
    "crates/lumos-macros",
    "crates/lumos-jsonapi",
    "crates/lumos-testing",
    "crates/lumos-cli",
    "crates/rusticate",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# HTTP + async. axum pulls hyper + matchit transitively; they are never
# declared directly.
axum = "0.8"
tokio = "1"
tower = "0.5"
tower-http = "0.7"
# Strict Accept/Content-Type parsing (used from Phase 4 negotiation).
mime = "0.3"
# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Errors + observability.
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# Object-safe async traits (service providers).
async-trait = "0.1"
# Config: config/*.toml + .env.
toml = "1"
dotenvy = "0.15"
# Zero-copy bodies (reserved for Phase 3+ extractors).
bytes = "1"
# ORM (rusticate only; sqlx 0.9 needs Rust 1.94, above the 1.88 floor).
# No default features: rusticate enables exactly the drivers it needs.
sqlx = { version = "0.8", default-features = false }
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Proc macros. syn v2: stable, well-understood API surface.
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# Phase 3 (lumos-core only, all behind optional features).
# argon2 re-exports the password-hash traits + RNG helpers it needs, so no
# direct password-hash dep; session tokens use its OS-RNG helper too.
validator = { version = "0.21", features = ["derive"] }
argon2 = "0.6"
askama = "0.16"

# Internal crates.
lumos-core = { version = "0.1.0", path = "crates/lumos-core" }
lumos-macros = { version = "0.1.0", path = "crates/lumos-macros" }
rusticate = { version = "0.1.0", path = "crates/rusticate" }
lumos-jsonapi = { version = "0.1.0", path = "crates/lumos-jsonapi" }
